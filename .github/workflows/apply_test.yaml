name: Apply dotfiles

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply the tested revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: chezmoi apply --source "$GITHUB_WORKSPACE" --force --no-tty

      - name: Verify idempotent apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/assert-chezmoi-clean.sh "$GITHUB_WORKSPACE"
          chezmoi apply --source "$GITHUB_WORKSPACE" --force --no-tty
          bash .github/scripts/assert-chezmoi-clean.sh "$GITHUB_WORKSPACE"

      - name: Smoke test Neovim and tmux
        run: bash .github/scripts/smoke-test.sh

      - name: Verify smoke tests did not change managed files
        if: always()
        run: bash .github/scripts/assert-chezmoi-clean.sh "$GITHUB_WORKSPACE"
