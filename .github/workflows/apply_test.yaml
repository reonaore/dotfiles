name: Apply dotfiles

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7

      - name: Add local executables to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply the tested revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash bootstrap-macos.sh --source "$GITHUB_WORKSPACE" --force --no-tty
          else
            installer=$(curl -fsSL https://get.chezmoi.io)
            sh -c "$installer" -- -b "$HOME/.local/bin"
            chezmoi apply --source "$GITHUB_WORKSPACE" --force --no-tty
          fi

      - name: Check macOS bootstrap prerequisites
        if: runner.os == 'macOS'
        run: bash .github/scripts/test-macos-bootstrap.sh

      - name: Verify idempotent apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/assert-chezmoi-clean.sh "$GITHUB_WORKSPACE"
          chezmoi apply --source "$GITHUB_WORKSPACE" --force --no-tty
          bash .github/scripts/assert-chezmoi-clean.sh "$GITHUB_WORKSPACE"

      - name: Smoke test Neovim and tmux
        run: bash .github/scripts/smoke-test.sh

      - name: Verify smoke tests did not change managed files
        if: always()
        run: bash .github/scripts/assert-chezmoi-clean.sh "$GITHUB_WORKSPACE"
